[project]
name = "dsm-genetic-algorithm"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "requests",
    "seaborn",
    "numpy",
    "pandas",
    "bokeh",
    "deap==1.4.2",
    "numba",
    "scoop",
    "ipykernel",
    "jupyterlab",
    "optuna>=4.8.0",
    "scikit-learn>=1.8.0",
    "openpyxl>=3.1.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsm_ga.py", "services", "api", "cli"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
dsm-ga = "cli.main:cli"
